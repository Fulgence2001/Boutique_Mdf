{% extends 'stock/base.html' %}
{% block title %}Créer une boutique{% endblock %}

{% block extra_css %}
<style>
    .card { background: white; border-radius: 16px; padding: 40px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card h1 { font-size: 22px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
    .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #4361ee; }
    .btn { width: 100%; padding: 13px; background: #4361ee; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h1>🏬 Créer une boutique</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom de la boutique *</label>
            <input type="text" name="nom" placeholder="Ex: Boutique Centrale" required>
        </div>
        <div class="form-group">
            <label>Adresse</label>
            <input type="text" name="adresse" placeholder="Ex: Dantokpa, Stand 12">
        </div>
        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" name="telephone" placeholder="Ex: +229 97 00 00 00">
        </div>
        <button type="submit" class="btn">Créer la boutique</button>
    </form>
</div>
{% endblock %}
